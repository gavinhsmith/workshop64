name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - run: make test
      # Experiences will come from the network: run the loader tests under sanitizers too.
      - run: make -C core test CC="gcc -g -fsanitize=address,undefined -fno-sanitize-recover=all"

  console:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: n64, image: 'ghcr.io/dragonminded/libdragon:preview', out: 'build/n64/' }
          - { platform: ogc, image: 'devkitpro/devkitppc:latest', out: 'build/ogc/' }
          - { platform: nds, image: 'devkitpro/devkitarm:latest', out: 'build/nds/' }
          - { platform: 3ds, image: 'devkitpro/devkitarm:latest', out: 'build/3ds/' }
          - { platform: web, image: 'emscripten/emsdk:latest', out: 'build/web/' }
    container: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - run: make -C platform/${{ matrix.platform }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: ${{ matrix.out }}
          if-no-files-found: error

  pc:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, name: pc-linux }
          - { os: windows-latest, name: pc-windows }
          - { os: macos-latest, name: pc-macos }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      # Static SDL3 so the binary runs without SDL installed.
      - uses: libsdl-org/setup-sdl@main
        with:
          version: 3-latest
          install-linux-dependencies: true
          cmake-arguments: -DSDL_SHARED=OFF -DSDL_STATIC=ON
      - run: cmake -S platform/pc -B build/cmake -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build/cmake --config Release
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: build/pc/
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [console, pc]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Zip each platform and publish
        working-directory: dist
        run: |
          chmod +x pc-linux/hangout64 pc-macos/hangout64
          for d in */; do (cd "$d" && zip -r "../hangout64-${d%/}.zip" .); done
          gh release create "$GITHUB_REF_NAME" *.zip --repo "$GITHUB_REPOSITORY" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
